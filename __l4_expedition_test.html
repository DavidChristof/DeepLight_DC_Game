document.querySelector('#freeze').onclick=async()=>{if(!active||waiting)return;waiting=true;try{const chunk=()=>snapshot().chunks.find(c=>c.x===1&&c.y===0);assert(!tasks.allCrewWorkers(s).some(w=>w.alive&&(w.chunkX|0)===1&&(w.chunkY|0)===0),'前哨仍有人');assert((s.chunkX|0)!==1||(s.chunkY|0)!==0,'玩家仍在前哨');const before=chunk();for(let i=0;i<10;i++){advance(120);await new Promise(r=>setTimeout(r,0));}const after=chunk();report.freeze={steps:1200,before:digest(JSON.stringify(canonical(before))),after:digest(JSON.stringify(canonical(after))),differences:differences(before,after)};assert(report.freeze.differences.length===0,'无人前哨仍更新');observe();status.textContent='无人前哨20秒完整冻结通过';}catch(e){fail(e);}finally{waiting=false;}};
document.querySelector('#regression').onclick=async()=>{if(!active||waiting)return;waiting=true;try{report.regression={checks:[],source:null,watch:null};const check=(label,opts={})=>{const r=g.__check(opts);report.regression.checks.push({label,...r});assert(r.ok,label+'断言失败');publish();};g.__watch(false);watchActive=false;g.__newGame(4242,'normal');g.__settings.autosave=false;s=g.__state;advance(1);check('new');g.__quick(true);assert(g.__saveSlot('s3')!==false,'回归保存失败');assert(g.__loadSlot('s3'),'回归读取失败');g.__settings.autosave=false;s=g.__state;g.__quick(true);check('loaded',{roundtrip:true});status.textContent='标准三日回放运行中';await new Promise(r=>setTimeout(r,0));const r=g.__replay({seed:4242,diff:'normal',days:3,policy:'home'});g.__settings.autosave=false;s=g.__state;g.__quick(true);report.regression.replay=r;check('replay');assert(r.steps===72001&&r.deaths===0&&r.minHp===54,'D323基线不同');report.regression.source=await g.__srcCheck();assert(report.regression.source.ok,'回归源码审计失败');g.__watch(true,20);for(let i=0;i<10;i++){g.__steps(120);await new Promise(r=>setTimeout(r,0));}g.__watch(false);report.regression.watch={steps:1200,log:g.__testLog()};assert(report.regression.watch.log.length===1&&report.regression.watch.log[0]==='共 0 类','回归监控失败');report.regression.menu=report.checks.find(c=>c.label==='menu');assert(report.regression.menu?.ok,'缺主菜单本实例检查');observe();status.textContent='本实例四态、源码与标准三日基线通过';}catch(e){fail(e);}finally{waiting=false;}};
document.querySelector('#export').onclick=()=>{const cp=JSON.parse(localStorage.getItem(cpKey)||'null');assert(cp?.entries?.length,'无检查点');const evidence=JSON.parse(localStorage.getItem(evidenceKey)||'null');const data={exportedAt:new Date().toISOString(),checkpoints:cp.entries,report:report||evidence||cp.report};out.textContent=JSON.stringify({checkpoints:cp.entries.map(e=>({hash:e.hash,day:e.snapshot.day,t:e.snapshot.t,inputs:e.inputs,source:e.source})),report:data.report},null,2);const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='l4-real-checkpoints.json';a.textContent='下载检查点JSON';status.replaceChildren(a);setTimeout(()=>URL.revokeObjectURL(url),60000);};
document.querySelector('#portable').onclick=async()=>{try{assert(!active,'先结束测试并恢复正式三键');const cp=JSON.parse(localStorage.getItem(cpKey)||'null'),hash=document.querySelector('#resumeHash').value.trim();assert(hash,'填写指定来源校验值');const entry=cp?.entries?.find(e=>e.hash===hash);assert(entry,'来源不存在');assert(digest(JSON.stringify(entry.snapshot))===entry.hash,'来源校验失败');const data={format:'l4-checkpoint-v1',entry,inputHistory:entry.inputLog?'checkpoint-local':'旧检查点未独立保存输入；不从其他分支补猜',provenance:'见docs/L4_EXPEDITION.md；健康共同来源与受控救援分离'};const raw=JSON.stringify(data),stream=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate'));const bytes=new Uint8Array(await new Response(stream).arrayBuffer());let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);const packed=btoa(binary);const decoded=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'))).text();assert(decoded===raw,'压缩读回不一致');out.textContent=packed;status.textContent=JSON.stringify({portable:true,hash,rawBytes:new TextEncoder().encode(raw).length,compressedBytes:bytes.length,base64Chars:packed.length,roundtripExact:true,inputLogPresent:!!entry.inputLog});}catch(e){status.textContent='文本导出失败：'+e.message;}};
document.querySelector('#proofExport').onclick=async()=>{try{assert(!active,'先结束测试并恢复正式三键');const r=JSON.parse(localStorage.getItem('__deep_light_l4_input_proof_v1')||'null');assert(r?.proofId&&r.finalSnapshot&&r.inputs.length,'缺少独立补录终态');assert(keys.every(k=>r.storage?.[k]===true),'正式三键未恢复');assert(r.inputs.every(e=>e.trusted===true&&e.before&&e.after),'输入账本不完整');const raw=JSON.stringify({format:'l4-independent-input-v1',report:r}),bytes=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer());const decoded=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'))).text();assert(decoded===raw,'补录压缩不一致');let binary='';for(const b of bytes)binary+=String.fromCharCode(b);out.textContent=btoa(binary);status.textContent=JSON.stringify({format:'l4-independent-input-v1',proofId:r.proofId,inputs:r.inputs.length,hash:digest(raw),rawBytes:new TextEncoder().encode(raw).length,compressedBytes:bytes.length,base64Chars:out.textContent.length,exact:true,notOriginalInputLog:true});}catch(e){status.textContent='独立补录导出失败：'+e.message;}};
</script></body></html>
