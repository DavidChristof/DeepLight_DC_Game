<?xml version="1.0" encoding="UTF-8"?>
<!--
  Deep-Light · player pawn vector concept v1
  Four frames: down | left | right | up
  Re-drawn from the first cloak concept, not a PNG wrapper. Integer paths and
  crispEdges keep the hard pixel-fantasy silhouette while allowing arbitrary
  display size. This is a preview asset; the runtime still uses player_pawn_v6.png.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="256" height="96" viewBox="0 0 256 96" shape-rendering="crispEdges"
     role="img" aria-label="Deep-Light vector player pawn, four directions">
  <title>Deep-Light vector player pawn v1</title>

  <!-- front -->
  <g id="frame-down">
    <!-- hair silhouette and warm brown pixel masses -->
    <path fill="#191923" d="M22 8h4V4h14v4h7v5h4v15h-5v5H20v-4h-5V14h7z"/>
    <path fill="#4d302f" d="M21 12h4V8h15v3h6v6h5v8h-6v-5H39v5H27v-4h-8v-6h2z"/>
    <path fill="#70443a" d="M25 9h7V6h7v4h6v4h-8v4h-9v5h-6v-8h3z"/>
    <path fill="#2a2229" d="M18 19h7v5h-4v5h-5v-8zM43 17h8v9h-4v5h-6v-8h2z"/>
    <!-- face -->
    <path fill="#5a3431" d="M21 18h5v-3h13v3h6v13h-4v6H26v-4h-5z"/>
    <path fill="#f0b98f" d="M23 18h4v-3h10v3h6v11h-4v6H28v-3h-5z"/>
    <path fill="#ffd2a5" d="M28 18h11v4h4v6h-5v4H29v-3h-5v-6h4z"/>
    <rect x="18" y="22" width="5" height="7" fill="#e49a78"/>
    <rect x="43" y="22" width="5" height="7" fill="#e49a78"/>
    <rect x="28" y="25" width="3" height="4" fill="#242331"/>
    <rect x="38" y="25" width="3" height="4" fill="#242331"/>
    <rect x="32" y="31" width="5" height="2" fill="#c98270"/>
    <!-- collar and cloak outline -->
    <path fill="#111927" d="M22 34h6v-3h12v3h7l7 8v11l4 7v24l-5 8H11l-5-8V58l4-7V42z"/>
    <path fill="#29364f" d="M24 36h5l3 6 4-6h6l6 7v11l4 7v22l-4 5H15l-4-6V59l4-7V43z"/>
    <path fill="#3c4e6f" d="M16 45h8l5 8v26h-7V61l-6 4zM42 43h6l5 10v24l-6 5V57z"/>
    <path fill="#202b42" d="M25 52h6v33h-9V61zM38 51h7v34h-8z"/>
    <path fill="#566988" d="M16 58h4v21h-4zM47 58h4v20h-4z"/>
    <!-- gold neckerchief, clasp and opening -->
    <path fill="#a86c29" d="M25 35h14l5 4-4 8H28l-6-8z"/>
    <path fill="#e0a33b" d="M28 36h8l4 3-3 5h-7l-4-4z"/>
    <path fill="#4b3a37" d="M30 47h8v38h-8z"/>
    <path fill="#765247" d="M32 49h4v32h-4z"/>
    <rect x="29" y="49" width="10" height="3" fill="#1a202d"/>
    <rect x="29" y="60" width="10" height="3" fill="#1a202d"/>
    <rect x="32" y="49" width="4" height="3" fill="#a7a9a5"/>
    <rect x="32" y="60" width="4" height="3" fill="#a7a9a5"/>
    <!-- stepped hem, deliberately not a straight crop -->
    <path fill="#172236" d="M14 83h8v3h6v2h12v-2h7v-3h5v5l-4 4H14l-4-4v-5z"/>
  </g>

  <!-- reusable side-view art: shoulders and cloak lean toward travel direction -->
  <defs>
  <g id="art-side">
    <path fill="#191923" d="M24 8h4V4h13v4h6v5h4v14h-5v6H27v-4h-8V15h5z"/>
    <path fill="#4d302f" d="M23 12h5V8h13v4h6v6h4v7h-7v-5h-7v5h-9v5h-7v-9h2z"/>
    <path fill="#70443a" d="M27 9h8V6h6v5h6v5h-9v4h-8v5h-6v-8h3z"/>
    <!-- left-facing profile with a one-pixel nose -->
    <path fill="#5a3431" d="M22 18h7v-3h11v4h4v11h-5v7H27v-4h-7v-5h-4v-5h6z"/>
    <path fill="#f0b98f" d="M24 18h6v-3h9v4h4v10h-6v6H28v-3h-6v-5h-4v-3h6z"/>
    <path fill="#ffd2a5" d="M27 19h10v4h5v5h-6v4h-7v-3h-6v-6h4z"/>
    <rect x="17" y="23" width="5" height="5" fill="#e49a78"/>
    <rect x="24" y="25" width="3" height="4" fill="#242331"/>
    <rect x="20" y="31" width="6" height="2" fill="#c98270"/>
    <!-- forward-leaning cloak: the hem shifts left, leaving a trailing fold -->
    <path fill="#111927" d="M26 35h7v-3h10l7 7 3 10-2 10 2 24-5 8H13l-6-8 3-25 2-13z"/>
    <path fill="#29364f" d="M28 37h6l3 6 5-7 6 5 3 10-3 9 2 22-4 6H15l-4-6 3-24 1-12z"/>
    <path fill="#3c4e6f" d="M17 45h9l5 8-4 28h-8l2-18-6 5zM40 43h7l5 11-5 12-4-8z"/>
    <path fill="#202b42" d="M26 51h7l-4 34h-9l4-25zM38 53h8l-1 31h-9z"/>
    <path fill="#566988" d="M15 59h4l-2 20h-4zM45 60h4l4 17-5 5z"/>
    <path fill="#a86c29" d="M27 35h13l5 5-5 8H29l-7-7z"/>
    <path fill="#e0a33b" d="M30 36h7l4 4-4 5h-7l-4-4z"/>
    <path fill="#4b3a37" d="M31 47h8l-2 38h-8z"/>
    <path fill="#765247" d="M33 49h4l-2 31h-4z"/>
    <rect x="31" y="49" width="10" height="3" fill="#1a202d"/>
    <rect x="30" y="61" width="9" height="3" fill="#1a202d"/>
    <rect x="34" y="49" width="4" height="3" fill="#a7a9a5"/>
    <rect x="33" y="61" width="4" height="3" fill="#a7a9a5"/>
    <path fill="#172236" d="M14 83h8v3h7v2h11v-2h7v-3h5v5l-4 4H13l-4-4v-5z"/>
  </g>
  </defs>

  <!-- left and right: right is a mirrored leaning profile -->
  <use xlink:href="#art-side" transform="translate(64 0)"/>
  <use xlink:href="#art-side" transform="translate(192 0) scale(-1 1)"/>

  <!-- back -->
  <g id="frame-up" transform="translate(192 0)">
    <path fill="#191923" d="M22 8h4V4h14v4h7v5h4v15h-5v5H20v-4h-5V14h7z"/>
    <path fill="#4d302f" d="M20 13h5V8h16v4h6v6h5v9h-7v5H22v-5h-6v-9h4z"/>
    <path fill="#70443a" d="M25 9h7V6h8v5h6v6h-8v5H28v4h-7v-9h4z"/>
    <path fill="#111927" d="M22 34h7v-3h12v3h7l7 8v11l4 7v24l-5 8H11l-5-8V58l4-7V42z"/>
    <path fill="#29364f" d="M24 36h6l3 6 4-6h6l6 7v11l4 7v22l-4 5H15l-4-6V59l4-7V43z"/>
    <path fill="#3c4e6f" d="M16 45h9l5 8v26l-7 6-4-24-6 4zM42 43h7l6 10v24l-6 7-4-27z"/>
    <path fill="#202b42" d="M25 52h6v33h-9V61zM38 51h7v34h-8z"/>
    <path fill="#566988" d="M16 58h4v21h-4zM47 58h4v20h-4z"/>
    <path fill="#a86c29" d="M25 35h14l5 4-4 8H28l-6-8z"/>
    <path fill="#e0a33b" d="M28 36h8l4 3-3 5h-7l-4-4z"/>
    <path fill="#172236" d="M14 83h8v3h6v2h12v-2h7v-3h5v5l-4 4H14l-4-4v-5z"/>
    <path fill="#101622" d="M26 51h13v31H26z"/>
    <path fill="#35445d" d="M28 53h9v25h-9z"/>
    <path fill="#697b92" d="M31 56h3v18h-3z"/>
  </g>
</svg>
